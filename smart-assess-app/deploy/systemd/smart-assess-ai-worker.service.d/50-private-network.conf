# SMART ASSESS - the AI worker's HTTP front (lighttpd) gets no network and almost nothing in /run (Step 15).
# NOT INSTALLED. Install (with approval) as
#   /etc/systemd/system/smart-assess-ai-worker.service.d/50-private-network.conf
# together with smart-assess-ai-worker-http.socket and the line
#   server.systemd-socket-activation = "enable"
# in /etc/smart-assess-ai-worker-runtime/lighttpd.conf (see worker-lighttpd.conf.example).
#
# Why: lighttpd parses every HTTP request sent to the worker. Without this, a compromised lighttpd could
# reach every service on 127.0.0.1 whenever the per-user egress filter is gone (after "nft flush ruleset",
# until the guard reloads it: up to 30 s), and every world-connectable socket file in /run (snapd, local
# SSH, polkit, systemd's own sockets). Now:
#   - PrivateNetwork=yes: its own empty network. It still serves 127.0.0.1:8095, because systemd binds that
#     address in the host network and hands over the listening socket (smart-assess-ai-worker-http.socket).
#   - only Unix sockets may be created; IP sockets cannot be opened at all.
#   - /run is an empty read-only folder except the PHP-FPM socket folder, its only connection.
# Fails closed: without the activation line lighttpd cannot open its own IP socket and does not start;
# without the socket unit the service is not started; callers then report the worker unreachable.
[Unit]
Requires=smart-assess-ai-worker-http.socket
After=smart-assess-ai-worker-http.socket
# A broken lighttpd (for example an invalid configuration) must not be restarted forever while systemd keeps
# accepting connections for it: callers would wait for their timeout. After 3 failed starts within 2 minutes
# systemd gives up, the socket unit fails too and closes 127.0.0.1:8095, so callers are refused at once.
# Recovery after the fix: sudo systemctl reset-failed smart-assess-ai-worker.service smart-assess-ai-worker-http.socket
#                         sudo systemctl start smart-assess-ai-worker-http.socket smart-assess-ai-worker.service
StartLimitIntervalSec=120
StartLimitBurst=3

[Service]
PrivateNetwork=yes
# The empty line first replaces the unit's own list instead of adding to it.
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX
TemporaryFileSystem=/run:ro
BindReadOnlyPaths=/run/smart-assess-ai-worker
