# SMART ASSESS - nftables.service loads /etc/nftables.conf, which begins with "flush ruleset" (and its
# ExecStop flushes everything): that removes the AI egress filters. Put them back straight after each
# start, reload and stop. NOT INSTALLED (see smart-assess-ai-egress-guard.service).
# "-": a guard failure never fails nftables.service itself (the host firewall stays as loaded); the guard
# has already stopped the AI services whose filter it could not restore, and it logs CRITICAL.
[Service]
ExecStartPost=-/usr/local/sbin/smart-assess-ai-egress-guard.sh
ExecReload=-/usr/local/sbin/smart-assess-ai-egress-guard.sh
ExecStopPost=-/usr/local/sbin/smart-assess-ai-egress-guard.sh
