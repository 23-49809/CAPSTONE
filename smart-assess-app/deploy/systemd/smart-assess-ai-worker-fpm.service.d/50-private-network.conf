# SMART ASSESS - the AI worker's PHP-FPM pool (it parses uploaded documents: PHP, Poppler, Tesseract) gets no
# network at all. NOT INSTALLED. Install (with approval) as
#   /etc/systemd/system/smart-assess-ai-worker-fpm.service.d/50-private-network.conf
# together with smart-assess-ai-ollama-link.socket/.service, SMART_ASSESS_WORKER_OLLAMA_SOCKET in
# /etc/smart-assess-ai-worker/worker.env and its env[] line in the pool (worker-php-fpm-pool.conf.example).
#
# Why: the worker's egress filter (nftables, by user) disappears whenever the ruleset is flushed (for example
# "nft flush ruleset", or nftables.service, whose /etc/nftables.conf begins with "flush ruleset"). Until it is
# reloaded (the guard: up to 30 s), the running pool could reach every service on 127.0.0.1 (MySQL, MySQL X,
# Apache, SSH, the DNS stub). A private network namespace is set up by systemd when the pool starts and no
# firewall change can affect it: inside there is only an empty loopback. lighttpd reaches the pool through its
# FastCGI socket file and the pool reaches Ollama through the link socket file; both work across namespaces.
# If the link or the setting is missing, the worker reports Ollama unreachable: it fails closed.
[Unit]
Requires=smart-assess-ai-ollama-link.socket
After=smart-assess-ai-ollama-link.socket

[Service]
PrivateNetwork=yes
# Only Unix sockets; the empty line first replaces the unit's own list instead of adding to it.
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX

# Step 16 (S1): keep the runtime folder when the pool restarts, automatically (crash, out-of-memory kill:
# Restart=on-failure) or manually. lighttpd (Step 15) sees /run/smart-assess-ai-worker only through a bind mount
# made when lighttpd started; if the folder were deleted and recreated while lighttpd kept running, lighttpd would
# keep the old, empty one and every request would fail until lighttpd was restarted. Measured on systemd 259
# (VM): an automatic restart of the pool also restarts lighttpd (it Requires= the pool), so this did not happen
# there; this setting keeps the bind valid even when lighttpd is not restarted with the pool (the folder and its
# inode stay; the pool recreates fpm.sock inside it). An explicit "systemctl stop" still removes the folder and
# stops lighttpd with it.
RuntimeDirectoryPreserve=restart

# Step 16 (S2): nothing in /run but what the pool needs. Without this the pool (and Poppler and Tesseract,
# which run inside it) could connect to every world-connectable socket there: snapd, the local SSH socket,
# polkit, systemd's control sockets, the journal, userdb. What stays, and why:
#   /run/smart-assess-ai-worker    its own runtime folder: it creates (and recreates) fpm.sock there;
#   /run/smart-assess-ai-ollama    the Ollama link (read only; connecting to a socket needs no write access);
#   /run/systemd/notify            Type=notify: without it the pool never reports ready and its start times out;
#   /run/systemd/journal/dev-log   the pool logs with error_log = syslog (/dev/log points there).
# Folders, not socket files, are bound: a socket recreated in a bound folder is seen, a bound file would not be.
# A socket created anywhere else in /run later is never seen. If one of these is missing the pool does not
# start: it fails closed.
TemporaryFileSystem=/run:ro
BindPaths=/run/smart-assess-ai-worker
BindReadOnlyPaths=/run/smart-assess-ai-ollama /run/systemd/notify /run/systemd/journal/dev-log
