# SMART ASSESS - the AI worker's PHP-FPM pool (it parses uploaded documents: PHP, Poppler, Tesseract) gets no
# network at all. NOT INSTALLED. Install (with approval) as
#   /etc/systemd/system/smart-assess-ai-worker-fpm.service.d/50-private-network.conf
# together with smart-assess-ai-ollama-link.socket/.service, SMART_ASSESS_WORKER_OLLAMA_SOCKET in
# /etc/smart-assess-ai-worker/worker.env and its env[] line in the pool (worker-php-fpm-pool.conf.example).
#
# Why: the worker's egress filter (nftables, by user) disappears whenever the ruleset is flushed (for example
# "nft flush ruleset", or nftables.service, whose /etc/nftables.conf begins with "flush ruleset"). Until it is
# reloaded (the guard: up to 30 s), the running pool could reach every service on 127.0.0.1 (MySQL, MySQL X,
# Apache, SSH, the DNS stub). A private network namespace is set up by systemd when the pool starts and no
# firewall change can affect it: inside there is only an empty loopback. lighttpd reaches the pool through its
# FastCGI socket file and the pool reaches Ollama through the link socket file; both work across namespaces.
# If the link or the setting is missing, the worker reports Ollama unreachable: it fails closed.
[Unit]
Requires=smart-assess-ai-ollama-link.socket
After=smart-assess-ai-ollama-link.socket

[Service]
PrivateNetwork=yes
# Only Unix sockets; the empty line first replaces the unit's own list instead of adding to it.
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX
