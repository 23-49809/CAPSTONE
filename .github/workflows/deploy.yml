
name: Deploy SMART ASSESS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: smart-assess-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Authenticate with AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::312106747458:role/GitHubSmartAssessDeployRole
          aws-region: eu-north-1

      - name: Trigger deployment through Systems Manager
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-054f2c729084ff026 \
            --document-name AWS-RunShellScript \
            --comment "SMART ASSESS deployment from commit $GITHUB_SHA" \
            --parameters 'commands=["sudo -n /usr/local/sbin/deploy-smart-assess.sh"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Started deployment command: $COMMAND_ID"

      - name: Wait for deployment and report result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-054f2c729084ff026 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-054f2c729084ff026 \
                  --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment. Check AWS Systems Manager for the command result."
          exit 1
