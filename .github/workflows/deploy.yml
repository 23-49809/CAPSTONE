
name: Deploy SMART ASSESS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: smart-assess-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    name: Deploy to production EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_JSON=$(curl -fsS --get \
            --data-urlencode "audience=sts.amazonaws.com" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")

          printf '%s' "$TOKEN_JSON" | python3 -c '
          import sys, json, base64
          response = json.load(sys.stdin)
          token = response["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in (
              "iss", "aud", "sub", "repository",
              "repository_id", "repository_owner",
              "repository_owner_id", "ref", "workflow_ref"
          ):
              print(f"{key}: {claims.get(key)}")
          '

          unset TOKEN_JSON

      - name: Authenticate with AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::312106747458:role/GitHubSmartAssessDeployRole
          aws-region: ap-southeast-1

      - name: Inspect production deployment script
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_COMMAND=$(cat <<'REMOTE'
          sudo -n python3 - <<'PY'
          import pathlib, re, shlex
          wanted = {"DB_HOST", "DB_PORT", "DB_NAME", "DB_USER", "SMART_ASSESS_DB_PASS"}
          values = {}
          for line in pathlib.Path("/etc/apache2/conf-enabled/smart-assess-env.conf").read_text().splitlines():
              try:
                  parts = shlex.split(line, comments=True)
              except ValueError:
                  continue
              if len(parts) == 3 and parts[0] == "SetEnv" and parts[1] in wanted:
                  values[parts[1]] = parts[2]
          for key in sorted(wanted):
              value = values.get(key, "")
              print(f"{key}: present={bool(value)}, length={len(value)}")
          if not re.fullmatch(r"[A-Za-z0-9_]+", values.get("DB_NAME", "")):
              raise SystemExit("DB_NAME is absent or not a simple identifier")
          if not values.get("SMART_ASSESS_DB_PASS"):
              raise SystemExit("Database password is absent")
          PY
          sudo -n du -sh /var/www/capstone/smart-assess-app /var/www/capstone/smart-assess.html /var/www/capstone/smart-assess-internal.html
          sudo -n apache2ctl -S 2>&1 | grep -E 'namevhost|port 80|port 443' | head -20
          command -v mysqldump
          df -h /var/backups
          REMOTE
          )
          PARAMETERS=$(printf '%s' "$REMOTE_COMMAND" | python3 -c 'import json, sys; print(json.dumps({"commands": [sys.stdin.read()]}))')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-051e38f99d3c2bd98 \
            --document-name AWS-RunShellScript \
            --comment "Read-only inspection of SMART ASSESS database configuration" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Started deployment command: $COMMAND_ID"

      - name: Report deployment script inspection
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-051e38f99d3c2bd98 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-051e38f99d3c2bd98 \
                  --query '{Output:StandardOutputContent,Errors:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-051e38f99d3c2bd98 \
                  --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment. Check AWS Systems Manager for the command result."
          exit 1
